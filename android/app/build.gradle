plugins { id 'com.android.application' }

android {
    namespace 'ai.eburon.edge'
    compileSdk 35

    defaultConfig {
        applicationId 'ai.eburon.edge'
        minSdk 26
        targetSdk 35
        versionCode 30400
        versionName '0.3.4'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.debug
        }
    }
}
