name: Build Eburon Edge APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'eburon-edge-termux/**'
      - 'VERSION'
      - 'build-release.sh'
      - '.github/workflows/release-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Static checks
        run: |
          bash -n install.sh build-release.sh eburon-edge-termux/install.sh eburon-edge-termux/start.sh eburon-edge-termux/stop.sh eburon-edge-termux/status.sh eburon-edge-termux/scripts/*.sh
          python -m py_compile eburon-edge-termux/gateway/*.py
          node --check eburon-edge-termux/translator/server.mjs
          python -m json.tool eburon-edge-termux/config/release.json >/dev/null
          python -m json.tool eburon-edge-termux/public/manifest.webmanifest >/dev/null
      - name: Build Termux release package
        run: |
          chmod +x build-release.sh
          ./build-release.sh
      - name: Build installable Android release APK
        run: gradle -p android --no-daemon clean assembleRelease
      - name: Collect release artifacts
        run: |
          VERSION="$(cat VERSION)"
          cp android/app/build/outputs/apk/release/app-release.apk "dist/EburonEdge-${VERSION}.apk"
          (cd dist && sha256sum *.zip *.apk > SHA256SUMS)
          ls -lh dist
      - uses: actions/upload-artifact@v4
        with:
          name: EburonEdge-${{ github.sha }}
          path: |
            dist/*.apk
            dist/*.zip
            dist/SHA256SUMS
      - name: Commit release artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f dist/*.apk dist/*.zip dist/SHA256SUMS
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "release: build $(cat VERSION) APK and Termux package [skip ci]"
          git push
