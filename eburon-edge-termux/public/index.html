<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#060708"><link rel="manifest" href="/manifest.webmanifest"><title>Eburon Edge</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#060708;color:#fff;min-height:100vh;display:grid;place-items:center}.card{width:min(92vw,620px);padding:32px;border:1px solid #24272b;border-radius:28px;background:#101214}.brand{font-size:13px;letter-spacing:.22em;color:#9ba3ad}.title{font-size:42px;font-weight:750;margin:12px 0}.muted{color:#9ba3ad;line-height:1.6}.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:26px}a{padding:17px;border-radius:16px;text-decoration:none;text-align:center;font-weight:700}a.primary{background:#fff;color:#08090a}a.secondary{border:1px solid #30343a;color:#fff}#state{margin-top:22px;font:13px ui-monospace;color:#9ba3ad}@media(max-width:520px){.actions{grid-template-columns:1fr}.title{font-size:34px}}</style></head><body><main class="card"><div class="brand">EBURON EDGE</div><div class="title">Offline translator</div><p class="muted">Local speech recognition, translation-only inference and on-device voice synthesis. No cloud is required after provisioning.</p><div class="actions"><a class="primary" href="/translate.html">Open Translator</a><a class="secondary" href="/settings.html">Settings</a></div><div id="state">Checking local engines…</div></main><script>fetch('/health',{cache:'no-store'}).then(r=>r.json()).then(x=>state.textContent=x.offline_ready?'Offline core ready':'Core starting — open Settings for status').catch(()=>state.textContent='Gateway unavailable. Start Eburon Edge in Termux.');if('serviceWorker'in navigator)navigator.serviceWorker.register('/service-worker.js').catch(()=>{});</script></body></html>
