<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#1e1f21"/>
<link rel="manifest" href="/manifest.webmanifest"/>
<title>Eburon Translator</title>
<style>
:root{--bg:#1e1f21;--border:rgba(255,255,255,.16);--idle:#282d30;--muted:#8b929a;--blue:#1f8aec;--ring:#a8b0b8}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}html,body{width:100%;height:100%;background:#121315}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100dvh;color:#fff;overflow:hidden;display:flex;justify-content:center}.app{width:100%;height:100dvh;background:var(--bg);display:flex;flex-direction:column;justify-content:space-between;padding:max(env(safe-area-inset-top),20px) clamp(18px,4vw,28px) max(env(safe-area-inset-bottom),28px)}.top{display:flex;justify-content:space-between;align-items:center;padding-top:8px}.state{font-size:12px;color:#727a84}.icon-btn{background:0;border:0;color:#fff;padding:8px;display:flex;text-decoration:none}.main{flex:1;display:flex;align-items:center;justify-content:center}.hint{text-align:center;color:#666f78;font-size:13px;line-height:1.5;opacity:.9}.bottom{display:flex;justify-content:center;padding-bottom:clamp(12px,4vh,30px)}.actions{display:flex;align-items:center;justify-content:center;gap:14px}.pill{display:flex;align-items:center;background:rgba(22,23,25,.6);border:1.5px solid var(--border);border-radius:42px;padding:6px 8px;gap:8px}.control{width:clamp(62px,17vw,74px);height:clamp(62px,17vw,74px);border-radius:24px;border:0;background:var(--idle);color:var(--muted);display:flex;align-items:center;justify-content:center}.control:active,.play:active{transform:scale(.94)}.play-wrap{width:82px;height:82px;border-radius:32px;border:1.5px solid var(--border);background:rgba(22,23,25,.6);display:flex;align-items:center;justify-content:center}.play-ring{width:68px;height:68px;border-radius:25px;border:3.5px solid var(--ring);display:flex;align-items:center;justify-content:center}.play{width:58px;height:58px;border-radius:20px;background:var(--blue);border:0;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(31,138,236,.35)}svg{width:28px;height:28px;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.triangle{width:26px;height:26px;stroke:#101c28;fill:none;stroke-width:3.2;transform:translateX(2px)}@media(min-width:768px){.app{padding-left:clamp(32px,8vw,100px);padding-right:clamp(32px,8vw,100px)}.bottom{padding-bottom:clamp(24px,6vh,64px)}.play-wrap{width:92px;height:92px}.play-ring{width:76px;height:76px}.play{width:64px;height:64px}}@media(max-width:380px){.actions{gap:8px}.pill{gap:5px;padding:5px 6px}.control{width:58px;height:58px}.play-wrap{width:74px;height:74px}.play-ring{width:62px;height:62px}.play{width:52px;height:52px}}
</style>
</head>
<body><div class="app">
<header class="top"><span id="state" class="state">Checking local AI…</span><a href="/settings.html" class="icon-btn" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="4" y1="6" x2="16" y2="6" stroke-width="2.5"/><circle cx="16" cy="6" r="3" fill="#fff" stroke="#1e1f21" stroke-width="2"/><line x1="8" y1="12" x2="20" y2="12" stroke-width="2.5"/><circle cx="8" cy="12" r="3" fill="#fff" stroke="#1e1f21" stroke-width="2"/><line x1="4" y1="18" x2="14" y2="18" stroke-width="2.5"/><circle cx="14" cy="18" r="3" fill="#fff" stroke="#1e1f21" stroke-width="2"/></svg></a></header>
<main class="main"><div class="hint">Offline dual translator<br>Tap Play to start streaming</div></main>
<footer class="bottom"><div class="actions"><div class="pill">
<button class="control" id="mic" aria-label="Microphone"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/><line x1="12" y1="18" x2="12" y2="22"/></svg></button>
<button class="control" id="speaker" aria-label="Speaker"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg></button>
<button class="control" id="reset" aria-label="Reset"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21.5 2v6h-6"/><path d="M21.34 15.57a9 9 0 1 1-2.4-9.36L21.5 8"/></svg></button></div>
<div class="play-wrap"><div class="play-ring"><button class="play" id="play" aria-label="Start"><svg class="triangle" viewBox="0 0 24 24"><polygon points="6 3 20 12 6 21 6 3"/></svg></button></div></div></div></footer>
</div>
<script>
let speakerOn=localStorage.getItem('eburonSpeaker')!=='off';const speaker=document.getElementById('speaker');function paintSpeaker(){speaker.style.color=speakerOn?'#8b929a':'#555b62'}paintSpeaker();speaker.onclick=()=>{speakerOn=!speakerOn;localStorage.setItem('eburonSpeaker',speakerOn?'on':'off');paintSpeaker()};document.getElementById('mic').onclick=()=>location.href='/translate.html';document.getElementById('play').onclick=()=>location.href='/translate.html';document.getElementById('reset').onclick=()=>{localStorage.removeItem('eburonHistory');document.getElementById('state').textContent='History cleared'};fetch('/health',{cache:'no-store'}).then(r=>r.json()).then(h=>document.getElementById('state').textContent=h.offline_ready?'Offline core ready':'Local AI starting…').catch(()=>document.getElementById('state').textContent='Start Eburon Edge in Termux');if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('/service-worker.js').catch(()=>{}));
</script></body></html>
