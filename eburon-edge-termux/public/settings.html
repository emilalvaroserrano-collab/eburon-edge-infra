<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Settings — Eburon</title><style>*{box-sizing:border-box}body{margin:0;background:#060708;color:#fff;font-family:system-ui}.wrap{max-width:720px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between}.top a{color:#aaa;text-decoration:none}.card{background:#101214;border:1px solid #25282d;border-radius:22px;padding:20px;margin-top:16px}label{display:block;color:#9aa2ac;font-size:13px;margin:14px 0 6px}select,button{width:100%;padding:13px;border-radius:13px;background:#17191c;color:#fff;border:1px solid #30343a;font-size:15px}button{margin-top:14px;font-weight:750}.status{white-space:pre-wrap;font:12px ui-monospace;color:#aeb5be}</style></head><body><div class="wrap"><div class="top"><b>Settings</b><a href="/translate.html">Translator</a></div><div class="card"><label>TTS provider</label><select id="provider"></select><label>Voice</label><select id="voice"></select><button id="preview">▶ Play sample</button><label>Mode</label><select id="mode"><option value="general">General</option><option value="medical">Medical</option></select></div><div class="card"><b>Local services</b><div id="status" class="status">Checking…</div></div></div><script>
const saved=JSON.parse(localStorage.getItem('eburonSettings')||'{}');mode.value=saved.mode||'general';
async function providers(){const j=await fetch('/v1/tts/providers',{cache:'no-store'}).then(r=>r.json());provider.innerHTML='';for(const p of j.providers){const o=new Option(`${p.name}${p.available?'':' — unavailable'}`,p.id);o.disabled=!p.available;provider.add(o)}provider.value=saved.ttsProvider&&[...provider.options].some(o=>o.value===saved.ttsProvider&&!o.disabled)?saved.ttsProvider:'supertonic';await voices()}
async function voices(){const j=await fetch('/v1/tts/catalog?provider='+encodeURIComponent(provider.value),{cache:'no-store'}).then(r=>r.json());voice.innerHTML='';for(const v of (j.voices||[])){const id=v.id||v.name;const o=new Option(v.name||id,id);if(v.installed===false)o.text+=' — not installed';voice.add(o)}voice.value=[...voice.options].some(o=>o.value===saved.voice)?saved.voice:(voice.options[0]?.value||'M1');save()}
function save(){localStorage.setItem('eburonSettings',JSON.stringify({ttsProvider:provider.value,voice:voice.value,mode:mode.value}))}provider.onchange=voices;voice.onchange=save;mode.onchange=save;preview.onclick=async()=>{save();const r=await fetch('/v1/tts/preview',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({provider:provider.value,voice:voice.value,language:'en',text:'Hello. This is your selected Eburon voice.'})});if(!r.ok){alert(await r.text());return}new Audio(URL.createObjectURL(await r.blob())).play()};async function health(){try{const j=await fetch('/health',{cache:'no-store'}).then(r=>r.json());status.textContent=JSON.stringify(j,null,2)}catch(e){status.textContent='Gateway unavailable: '+e.message}}providers().catch(e=>status.textContent=e.message);health();setInterval(health,5000);
</script></body></html>
