<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover"/><meta name="theme-color" content="#202225"/><link rel="manifest" href="/manifest.webmanifest"/><title>Eburon Translator - Settings</title>
<style>
:root{--bg:#202225;--input:#0c0d0e;--label:#8b929d;--white:#fff;--blue:#1f93ff;--blue-text:#081a2f;--divider:#2e3238;--history:#7c838f;--muted:#656d79}*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}html,body{width:100%;min-height:100%;background:#121315}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100dvh;display:flex;justify-content:center;color:#fff}.app{width:100%;min-height:100dvh;background:var(--bg);display:flex;flex-direction:column;padding:max(env(safe-area-inset-top),18px) clamp(22px,5vw,38px) max(env(safe-area-inset-bottom),24px);overflow-y:auto}.header{display:flex;justify-content:space-between;align-items:center;padding:10px 0 20px;border-bottom:1px solid var(--divider)}.title{font-size:clamp(26px,7vw,36px);font-weight:500}.close{color:#fff;padding:6px;display:flex}.form{display:flex;flex-direction:column;gap:22px;padding-top:28px;flex:1}.group{display:flex;flex-direction:column;gap:10px}.label{font-size:clamp(15px,4.3vw,19px);color:var(--label)}.select{position:relative}.select select{width:100%;height:58px;background:var(--input);border:1px solid #5a5f66;border-radius:12px;padding:0 44px 0 16px;color:#fff;font-size:17px;appearance:none;outline:none}.arrow{position:absolute;right:16px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--label)}.checkrow{display:flex;align-items:center;gap:14px;cursor:pointer}.check{width:24px;height:24px;border-radius:4px;background:#fff;border:1px solid #6b7178;display:flex;align-items:center;justify-content:center;flex-shrink:0}.check.checked{background:var(--blue);border-color:var(--blue)}.tick{display:none;width:15px;height:15px;stroke:#fff;stroke-width:3.2}.checked .tick{display:block}.section,.history-title{font-size:14px;font-weight:700;color:var(--history);text-transform:uppercase;letter-spacing:.8px}.voice-row{display:grid;grid-template-columns:1fr auto;gap:10px}.preview{height:58px;min-width:118px;border-radius:12px;border:1px solid #4d5660;background:#111417;color:#dfe8f2;font-size:15px;font-weight:600;padding:0 16px}.note{font-size:12px;color:var(--muted);line-height:1.5}.note.ok{color:#65c18c}.note.warn{color:#f0b86e}.save{width:100%;height:58px;background:var(--blue);color:var(--blue-text);font-size:18px;font-weight:600;border:0;border-radius:12px}.divider{height:1px;background:var(--divider);margin:14px 0}.history-head{display:flex;justify-content:space-between;align-items:center}.history-actions{display:flex;gap:18px}.linkbtn{background:0;border:0;color:#656d79;font-size:14px}.history{display:flex;flex-direction:column;gap:8px;padding:6px 0 20px}.item{padding:10px 12px;border:1px solid var(--divider);border-radius:10px;color:#c5cad0;font-size:14px}.device{border:1px solid var(--divider);border-radius:12px;padding:14px 16px;color:#8b929d;font-size:13px;line-height:1.7}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--blue);color:var(--blue-text);padding:10px 20px;border-radius:30px;font-weight:600;opacity:0;transition:.25s}.toast.show{transform:translateX(-50%);opacity:1}@media(min-width:768px){.app{padding-left:clamp(40px,9vw,120px);padding-right:clamp(40px,9vw,120px)}.select select,.save,.preview{height:64px}}@media(max-width:430px){.voice-row{grid-template-columns:1fr}.preview{width:100%}}
</style></head><body><div class="app"><header class="header"><h1 class="title">Settings</h1><a href="/" class="close" aria-label="Close"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></a></header><div class="form">
<div class="group"><label class="label">Staff Language (Language 1)</label><div class="select"><select id="staff"></select><span class="arrow">⌄</span></div></div><div class="group"><label class="label">Guest Language (Language 2)</label><div class="select"><select id="guest"></select><span class="arrow">⌄</span></div></div><div class="checkrow" id="autoRow"><div class="check checked" id="auto"><svg class="tick" viewBox="0 0 24 24" fill="none"><polyline points="20 6 9 17 4 12"/></svg></div><span>Auto-detect Guest Language</span></div>
<div class="group"><span class="section">Voice Engine</span><label class="label">TTS Provider</label><div class="select"><select id="provider"></select><span class="arrow">⌄</span></div><div id="providerNote" class="note">Checking local voice engines…</div></div><div class="group"><label class="label">AI Voice</label><div class="voice-row"><div class="select"><select id="voice"></select><span class="arrow">⌄</span></div><button class="preview" id="preview">▶ Play Sample</button></div><div id="voiceNote" class="note"></div></div>
<div class="group"><span class="section">Translation Mode</span><div class="checkrow" data-mode="medical"><div class="check" id="medical"><svg class="tick" viewBox="0 0 24 24" fill="none"><polyline points="20 6 9 17 4 12"/></svg></div><span>Medical Terms</span></div><div class="checkrow" data-mode="general"><div class="check" id="general"><svg class="tick" viewBox="0 0 24 24" fill="none"><polyline points="20 6 9 17 4 12"/></svg></div><span>General</span></div></div><button class="save" id="save">Save Settings</button><div class="divider"></div><div class="history-head"><span class="history-title">Translation History</span><div class="history-actions"><button class="linkbtn" id="export">⇩ Export</button><button class="linkbtn" id="clear">⌫ Clear</button></div></div><div class="history" id="history"></div><div class="device" id="device">Local AI · checking…</div></div></div><div class="toast" id="toast">Settings Saved</div>
<script>
const $=id=>document.getElementById(id),saved=JSON.parse(localStorage.getItem('eburonSettings')||'{}'),fallback=[['en','English'],['nl','Dutch / Flemish'],['fr','French'],['de','German'],['es','Spanish'],['it','Italian'],['pt','Portuguese'],['pl','Polish'],['ar','Arabic'],['hi','Hindi'],['id','Indonesian'],['ja','Japanese'],['ko','Korean'],['ru','Russian'],['uk','Ukrainian'],['tr','Turkish'],['vi','Vietnamese'],['sv','Swedish'],['da','Danish'],['fi','Finnish'],['cs','Czech'],['bg','Bulgarian'],['el','Greek'],['et','Estonian'],['hr','Croatian'],['hu','Hungarian'],['lt','Lithuanian'],['lv','Latvian'],['ro','Romanian'],['sk','Slovak'],['sl','Slovenian']],samples={en:'Hello. This is your selected Eburon voice.',nl:'Goedendag. Dit is uw geselecteerde Eburon-stem.',fr:'Bonjour. Voici la voix Eburon sélectionnée.',de:'Guten Tag. Dies ist Ihre ausgewählte Eburon-Stimme.',es:'Hola. Esta es la voz de Eburon seleccionada.'};let auto=saved.autoDetect!==false,mode=saved.mode||'medical',audio=null;function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1500)}function paint(){$('auto').classList.toggle('checked',auto);$('medical').classList.toggle('checked',mode==='medical');$('general').classList.toggle('checked',mode==='general')}
async function languages(){let list=fallback;try{const d=await fetch('/v1/languages',{cache:'no-store'}).then(r=>r.json());if(d.languages?.length)list=d.languages.map(x=>[x.code,x.name])}catch{}for(const id of ['staff','guest'])$(id).innerHTML=list.map(([c,n])=>`<option value="${c}">${n}</option>`).join('');$('staff').value=saved.staffLang||'nl';$('guest').value=saved.guestLang||'en'}
async function providers(){const d=await fetch('/v1/tts/providers',{cache:'no-store'}).then(r=>r.json());$('provider').innerHTML='';for(const p of d.providers){const o=new Option(p.name+(p.available?'':' — unavailable'),p.id);o.disabled=!p.available;$('provider').add(o)}const wanted=saved.ttsProvider||'supertonic';$('provider').value=[...$('provider').options].some(o=>o.value===wanted&&!o.disabled)?wanted:'supertonic';await voices()}
async function voices(){const p=$('provider').value;$('preview').disabled=true;try{const d=await fetch('/v1/tts/catalog?provider='+encodeURIComponent(p),{cache:'no-store'}).then(r=>r.json());$('providerNote').className='note '+(d.available?'ok':'warn');$('providerNote').textContent=d.available?'Local engine ready':'Engine unavailable on this tablet; Supertonic is the safe fallback.';const vs=d.voices||[];$('voice').innerHTML=vs.length?vs.map(v=>`<option value="${v.id||v.name}">${v.name||v.id}${v.installed===false?' — not installed':''}</option>`).join(''):'<option value="">No local voices available</option>';const wanted=p===(saved.ttsProvider||'supertonic')&&saved.voice?saved.voice:(p==='supertonic'?'M1':'');if(wanted&&[...$('voice').options].some(o=>o.value===wanted))$('voice').value=wanted;$('preview').disabled=!d.available||!vs.length;$('voiceNote').textContent=p==='supertonic'?'10 local voice styles · 31 supported languages':p==='piper'?'Piper remains optional until an isolated Android runtime is verified.':'Optional provider'}catch(e){$('providerNote').className='note warn';$('providerNote').textContent='Voice engine unavailable';$('preview').disabled=true}}
async function sample(){if(audio){audio.pause();audio=null}$('preview').disabled=true;$('preview').textContent='Loading…';try{const lang=$('guest').value||'en',r=await fetch('/v1/tts/preview',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({provider:$('provider').value,voice:$('voice').value,language:lang,text:samples[lang]||samples.en})});if(!r.ok)throw new Error('Voice preview failed');const u=URL.createObjectURL(await r.blob());audio=new Audio(u);audio.onended=()=>{URL.revokeObjectURL(u);$('preview').textContent='▶ Play Sample';$('preview').disabled=false};await audio.play();$('preview').textContent='■ Playing'}catch(e){toast(e.message);$('preview').textContent='▶ Play Sample';$('preview').disabled=false}}
function renderHistory(){const h=JSON.parse(localStorage.getItem('eburonHistory')||'[]');$('history').innerHTML=h.length?h.slice(0,20).map(x=>`<div class="item">${new Date(x.time).toLocaleString()} · ${String(x.translated_text||'').replace(/[<>&]/g,s=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[s]))}</div>`).join(''):'<div class="item">No translation history yet.</div>'}async function health(){try{const [h,v]=await Promise.all([fetch('/health',{cache:'no-store'}).then(r=>r.json()),fetch('/v1/system/version',{cache:'no-store'}).then(r=>r.json()).catch(()=>({}))]);$('device').innerHTML=`Local AI · ${h.offline_ready?'ready':'starting'}<br>STT · ${h.components?.stt?'ready':'down'} · Translator · ${h.components?.translator?'ready':'down'}<br>TTS · Supertonic ${h.components?.tts?.supertonic?'ready':'down'} · Piper ${h.components?.tts?.piper?'ready':'optional'}<br>Release · ${v.eburon||'unknown'}`}catch{$('device').innerHTML='Local AI · unavailable<br>Gateway · 127.0.0.1:8850'}}
$('autoRow').onclick=()=>{auto=!auto;paint()};document.querySelectorAll('[data-mode]').forEach(el=>el.onclick=()=>{mode=el.dataset.mode;paint()});$('provider').onchange=voices;$('preview').onclick=sample;$('save').onclick=()=>{localStorage.setItem('eburonSettings',JSON.stringify({staffLang:$('staff').value,guestLang:$('guest').value,autoDetect:auto,ttsProvider:$('provider').value,voice:$('voice').value,mode}));toast('Settings Saved');setTimeout(()=>location.href='/',650)};$('clear').onclick=()=>{localStorage.removeItem('eburonHistory');renderHistory()};$('export').onclick=()=>{const blob=new Blob([localStorage.getItem('eburonHistory')||'[]'],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='eburon-translation-history.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};(async()=>{await languages();paint();renderHistory();await providers().catch(()=>{});await health()})();setInterval(health,5000);if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('/service-worker.js').catch(()=>{}));
</script></body></html>
