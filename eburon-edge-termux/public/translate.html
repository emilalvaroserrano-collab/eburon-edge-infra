<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Translate — Eburon</title><style>*{box-sizing:border-box}body{margin:0;background:#060708;color:#fff;font-family:system-ui}.wrap{max-width:760px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center}.top a{color:#aaa;text-decoration:none}.panel{margin-top:18px;padding:20px;border:1px solid #25282d;border-radius:24px;background:#101214}.langs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}select,button{background:#17191c;color:#fff;border:1px solid #30343a;border-radius:14px;padding:14px;font-size:16px}button#talk{width:100%;margin-top:18px;background:#fff;color:#08090a;font-weight:800}.live{min-height:180px;margin-top:16px}.label{font-size:12px;color:#8f98a3;text-transform:uppercase;letter-spacing:.12em}.text{font-size:24px;line-height:1.35;margin:7px 0 18px}.status{font:13px ui-monospace;color:#9ba3ad}.speaking{opacity:.55}</style></head><body><div class="wrap"><div class="top"><b>Eburon Edge</b><a href="/settings.html">Settings</a></div><div class="panel"><div class="langs"><select id="staff"></select><span>⇄</span><select id="guest"></select></div><button id="talk">Start listening</button><div class="live"><div class="label">Heard</div><div id="heard" class="text">—</div><div class="label">Translation</div><div id="translated" class="text">—</div><div id="status" class="status">Idle</div></div></div></div><script>
const LANGS=[['en','English'],['nl','Dutch / Flemish'],['fr','French'],['de','German'],['es','Spanish'],['it','Italian'],['pt','Portuguese'],['pl','Polish'],['ar','Arabic'],['hi','Hindi'],['id','Indonesian'],['ja','Japanese'],['ko','Korean'],['ru','Russian'],['uk','Ukrainian'],['tr','Turkish'],['vi','Vietnamese'],['sv','Swedish'],['da','Danish'],['fi','Finnish'],['cs','Czech'],['bg','Bulgarian'],['el','Greek'],['et','Estonian'],['hr','Croatian'],['hu','Hungarian'],['lt','Lithuanian'],['lv','Latvian'],['ro','Romanian'],['sk','Slovak'],['sl','Slovenian']];
for(const [c,n] of LANGS){staff.add(new Option(n,c));guest.add(new Option(n,c))}staff.value='nl';guest.value='en';
let ws,stream,rec,audioCtx,analyser,raf,chunks=[],active=false,speech=false,lastVoice=0,born=0; const RMS=.022,END=650,MIN=350,MAX=12000;
function set(s){status.textContent=s} function config(){const cfg=JSON.parse(localStorage.getItem('eburonSettings')||'{}');return{type:'configure',staff_language:staff.value,guest_language:guest.value,voice:cfg.voice||'M1',tts_provider:cfg.ttsProvider||'supertonic',mode:cfg.mode||'general',speaker:true,audio_mime:rec?.mimeType||'audio/webm'}}
async function socket(){if(ws&&ws.readyState===1)return;ws=new WebSocket(`ws://${location.host}/ws/live`);ws.binaryType='arraybuffer';await new Promise((ok,fail)=>{ws.onopen=ok;ws.onerror=fail});ws.onmessage=async e=>{if(e.data instanceof ArrayBuffer){document.body.classList.add('speaking'); if(rec?.state==='recording')rec.pause(); const url=URL.createObjectURL(new Blob([e.data],{type:'audio/wav'})); const a=new Audio(url); await a.play().catch(()=>{}); await new Promise(r=>{a.onended=r;a.onerror=r}); URL.revokeObjectURL(url); if(active&&rec?.state==='paused')rec.resume();document.body.classList.remove('speaking');return} const m=JSON.parse(e.data);if(m.type==='ready'||m.type==='configured')return;if(m.type==='stage')set(m.stage);if(m.type==='transcript_final')heard.textContent=m.text;if(m.type==='translation_final')translated.textContent=m.text;if(m.type==='turn_complete')set(m.ok?'Listening':'Turn failed');if(m.type==='error')set(m.message||'Error')};ws.send(JSON.stringify(config()));}
async function commit(){if(!chunks.length||!ws||ws.readyState!==1)return;const blob=new Blob(chunks,{type:rec.mimeType});chunks=[];ws.send(await blob.arrayBuffer());ws.send(JSON.stringify({type:'commit',tts:true}));set('Processing');}
async function start(){await socket();stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});audioCtx=new AudioContext();const src=audioCtx.createMediaStreamSource(stream);analyser=audioCtx.createAnalyser();analyser.fftSize=1024;src.connect(analyser);rec=new MediaRecorder(stream,MediaRecorder.isTypeSupported('audio/webm;codecs=opus')?{mimeType:'audio/webm;codecs=opus'}:{});rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};rec.start(180);active=true;born=performance.now();talk.textContent='Stop';set('Listening');tick();}
function tick(){if(!active)return;const a=new Uint8Array(analyser.fftSize);analyser.getByteTimeDomainData(a);let s=0;for(const v of a){const x=(v-128)/128;s+=x*x}const rms=Math.sqrt(s/a.length),now=performance.now();if(rms>RMS){speech=true;lastVoice=now}if(speech&&now-lastVoice>END&&now-born>MIN){speech=false;born=now;commit()}if(now-born>MAX){speech=false;born=now;commit()}raf=requestAnimationFrame(tick)}
function stop(){active=false;cancelAnimationFrame(raf);if(rec&&rec.state!=='inactive')rec.stop();stream?.getTracks().forEach(t=>t.stop());audioCtx?.close();talk.textContent='Start listening';set('Stopped')}
talk.onclick=()=>active?stop():start().catch(e=>set(e.message));staff.onchange=()=>ws?.readyState===1&&ws.send(JSON.stringify(config()));guest.onchange=staff.onchange;
</script></body></html>
