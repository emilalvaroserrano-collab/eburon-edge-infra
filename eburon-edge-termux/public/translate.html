<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover"/><meta name="theme-color" content="#1e1f21"/><link rel="manifest" href="/manifest.webmanifest"/><title>Eburon Translator - Streaming</title>
<style>
:root{--bg:#1e1f21;--border:rgba(255,255,255,.16);--idle:#282d30;--muted:#8b929a;--orange:#ff4513;--navy:#0f2a4a;--blue:#298df8}*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}html,body{width:100%;height:100%;background:#121315}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100dvh;display:flex;justify-content:center;color:#fff;overflow:hidden}.app{width:100%;height:100dvh;background:var(--bg);display:flex;flex-direction:column;justify-content:space-between;padding:max(env(safe-area-inset-top),20px) clamp(18px,4vw,28px) max(env(safe-area-inset-bottom),22px);position:relative}.top{display:flex;justify-content:flex-end;padding-top:8px}.settings{background:0;border:0;color:#fff;padding:8px;display:flex}.main{flex:1;display:flex;align-items:center;justify-content:center}.live{width:min(88vw,760px);text-align:center;display:none}.label{font-size:12px;text-transform:uppercase;letter-spacing:.12em;margin-bottom:8px}.heard-label{color:#767d85}.translation-label{color:var(--blue)}.heard{font-size:clamp(18px,4.5vw,28px);line-height:1.35;color:#c8cdd2;margin-bottom:22px}.translated{font-size:clamp(22px,5.5vw,34px);line-height:1.3;font-weight:500}.bottom{display:flex;flex-direction:column;align-items:center;padding-bottom:clamp(8px,3vh,22px)}.viz{display:flex;align-items:center;justify-content:center;gap:4px;margin-bottom:18px;height:18px;max-width:100%;overflow:hidden}.dot{width:5px;height:7px;background:var(--orange);border-radius:3px;animation:pulse 1.1s ease-in-out infinite alternate}@keyframes pulse{0%{height:5px;opacity:.65;transform:scaleY(.7)}50%{height:13px;opacity:1;transform:scaleY(1.3)}100%{height:6px;opacity:.8;transform:scaleY(.85)}}.actions{display:flex;align-items:flex-start;justify-content:center;gap:14px}.pill{display:flex;align-items:center;background:rgba(22,23,25,.6);border:1.5px solid var(--border);border-radius:42px;padding:6px 8px;gap:8px}.control{width:clamp(62px,17vw,74px);height:clamp(62px,17vw,74px);border-radius:24px;border:0;background:var(--idle);color:var(--muted);display:flex;align-items:center;justify-content:center}.control.active{background:var(--orange);color:#111;box-shadow:0 4px 18px rgba(255,69,19,.4)}.pause-col{display:flex;flex-direction:column;align-items:center;gap:8px}.pause-wrap{width:82px;height:82px;border-radius:32px;border:1.5px solid var(--border);background:rgba(22,23,25,.6);display:flex;align-items:center;justify-content:center}.pause{width:68px;height:68px;border-radius:24px;background:var(--navy);border:2px solid var(--blue);display:flex;align-items:center;justify-content:center}.bars{display:flex;gap:6px}.bar{width:6px;height:20px;border:2.2px solid var(--blue);border-radius:2px}.streaming{color:var(--blue);font-size:14px}.icon{width:28px;height:28px;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}.toast{position:absolute;top:max(env(safe-area-inset-top),18px);left:50%;transform:translateX(-50%);font-size:12px;color:#8b929a;opacity:0;transition:.2s;pointer-events:none;white-space:nowrap}.toast.show{opacity:1}@media(min-width:768px){.app{padding-left:clamp(32px,8vw,100px);padding-right:clamp(32px,8vw,100px)}.bottom{padding-bottom:clamp(20px,6vh,64px)}}@media(max-width:380px){.actions{gap:8px}.pill{gap:5px;padding:5px 6px}.control{width:58px;height:58px}.pause-wrap{width:74px;height:74px}.pause{width:62px;height:62px}}
</style></head><body><div class="app"><div class="toast" id="toast">Connecting local AI…</div><header class="top"><a href="/settings.html" class="settings" aria-label="Settings"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="4" y1="6" x2="16" y2="6" stroke-width="2.5"/><circle cx="16" cy="6" r="3" fill="#fff" stroke="#1e1f21" stroke-width="2"/><line x1="8" y1="12" x2="20" y2="12" stroke-width="2.5"/><circle cx="8" cy="12" r="3" fill="#fff" stroke="#1e1f21" stroke-width="2"/><line x1="4" y1="18" x2="14" y2="18" stroke-width="2.5"/><circle cx="14" cy="18" r="3" fill="#fff" stroke="#1e1f21" stroke-width="2"/></svg></a></header><main class="main"><div class="live" id="live"><div class="label heard-label">Heard</div><div class="heard" id="heard"></div><div class="label translation-label">Translation</div><div class="translated" id="translated"></div></div></main><footer class="bottom"><div class="viz" id="viz"></div><div class="actions"><div class="pill"><button class="control" id="mic"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/><line x1="12" y1="18" x2="12" y2="22"/></svg></button><button class="control" id="speaker"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg></button><button class="control" id="reset"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21.5 2v6h-6"/><path d="M21.34 15.57a9 9 0 1 1-2.4-9.36L21.5 8"/></svg></button></div><div class="pause-col"><div class="pause-wrap"><button class="pause" id="pause"><div class="bars"><div class="bar"></div><div class="bar"></div></div></button></div><span class="streaming">Streaming</span></div></div></footer></div>
<script>
const $=id=>document.getElementById(id),settings=JSON.parse(localStorage.getItem('eburonSettings')||'{}');for(let i=0;i<32;i++){const d=document.createElement('div');d.className='dot';d.style.animationDelay=((Math.sin((i/32)*Math.PI)*.6).toFixed(2))+'s';d.style.animationDuration=(.78+((i*31)%35)/100).toFixed(2)+'s';$('viz').appendChild(d)}let micOn=false,speakerOn=localStorage.getItem('eburonSpeaker')!=='off',ws=null,stream=null,ctx=null,analyser=null,rec=null,busy=false,speech=false,lastVoice=0,born=0,raf=0,closed=false,turnDone=false,playing=false,reconnect=null,armed=false;const MIME=MediaRecorder.isTypeSupported('audio/webm;codecs=opus')?'audio/webm;codecs=opus':'audio/webm',RMS=.022,END=650,MIN=350,MAX=12000;
function status(t,ms=1500){$('toast').textContent=t;$('toast').classList.add('show');clearTimeout(status.t);status.t=setTimeout(()=>$('toast').classList.remove('show'),ms)}function tracks(on){stream?.getAudioTracks().forEach(t=>t.enabled=on)}function paint(){$('mic').classList.toggle('active',micOn&&!busy);$('viz').style.opacity=micOn&&!busy?'1':'.18';$('speaker').style.color=speakerOn?'#8b929a':'#555b62'}function history(x){const h=JSON.parse(localStorage.getItem('eburonHistory')||'[]');h.unshift(x);localStorage.setItem('eburonHistory',JSON.stringify(h.slice(0,200)))}
function configure(){if(ws?.readyState!==WebSocket.OPEN)return;ws.send(JSON.stringify({type:'configure',staff_language:settings.staffLang||'nl',guest_language:settings.guestLang||'en',auto_detect_guest:settings.autoDetect!==false,voice:settings.voice||'M1',tts_provider:settings.ttsProvider||'supertonic',mode:settings.mode||'medical',speaker:speakerOn,audio_mime:MIME}))}
function socket(){return new Promise((ok,fail)=>{ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws/live');ws.binaryType='arraybuffer';const t=setTimeout(()=>fail(new Error('WebSocket timeout')),6000);ws.onopen=()=>{clearTimeout(t);configure();ok()};ws.onerror=()=>{clearTimeout(t);fail(new Error('Local AI connection failed'))};ws.onclose=()=>{if(!closed){if(busy){busy=false;turnDone=false;tracks(micOn);paint()}clearTimeout(reconnect);reconnect=setTimeout(()=>socket().catch(()=>{}),1200)}};ws.onmessage=message})}
async function message(e){if(typeof e.data!=='string'){if(speakerOn)await play(e.data);return}let m;try{m=JSON.parse(e.data)}catch{return}if(m.type==='ready'){configure();status(micOn?'Local AI connected':'Tap microphone to start',2200)}else if(m.type==='stage'){if(m.stage==='stt')status('Transcribing…');else if(m.stage==='translate')status('Translating…');else if(m.stage==='tts')status('Generating voice…')}else if(m.type==='transcript_final'){$('live').style.display='block';$('heard').textContent=m.text||'';$('translated').textContent='';status('Translating…')}else if(m.type==='translation_final'){$('live').style.display='block';$('translated').textContent=m.text||'';history({time:Date.now(),source:m.source_language,target:m.target_language,source_text:$('heard').textContent,translated_text:m.text});status('Translation ready')}else if(m.type==='tts_begin')status('Speaking…');else if(m.type==='error')status('Error: '+(m.message||'pipeline failed'),3200);else if(m.type==='turn_complete'){turnDone=true;resume()}}
async function openMic(){stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true,channelCount:1}});ctx=new (window.AudioContext||window.webkitAudioContext)();await ctx.resume();if(ctx.state!=='running')throw new Error('Audio engine is blocked. Tap microphone again.');const src=ctx.createMediaStreamSource(stream);analyser=ctx.createAnalyser();analyser.fftSize=1024;analyser.smoothingTimeConstant=.18;src.connect(analyser);armed=true;startRecorder();vad()}
async function armMic(){if(!armed){await openMic();return}if(ctx?.state!=='running')await ctx.resume();tracks(true);startRecorder()}
function startRecorder(){if(closed||busy||!micOn||!stream||rec?.state==='recording')return;speech=false;lastVoice=0;born=performance.now();const chunks=[];rec=new MediaRecorder(stream,{mimeType:MIME,audioBitsPerSecond:48000});rec.ondataavailable=e=>{if(e.data?.size)chunks.push(e.data)};rec.onerror=()=>{busy=false;tracks(micOn);paint();status('Recorder error',2500)};rec.onstop=async()=>{if(closed)return;if(!busy){setTimeout(startRecorder,40);return}const blob=new Blob(chunks,{type:MIME});if(blob.size<1200){busy=false;tracks(micOn);paint();setTimeout(startRecorder,50);return}try{if(ws?.readyState!==WebSocket.OPEN)await socket();ws.send(await blob.arrayBuffer());ws.send(JSON.stringify({type:'commit',tts:speakerOn}));status('Transcribing…')}catch{busy=false;tracks(micOn);paint();status('Local AI disconnected',2800);setTimeout(startRecorder,200)}};rec.start()}
function finish(){if(busy||rec?.state!=='recording')return;busy=true;paint();rec.stop();tracks(false)}function vad(){const data=new Uint8Array(analyser.fftSize);const loop=()=>{if(closed)return;if(!busy&&micOn&&rec?.state==='recording'){analyser.getByteTimeDomainData(data);let sum=0;for(const v of data){const x=(v-128)/128;sum+=x*x}const rms=Math.sqrt(sum/data.length),now=performance.now(),age=now-born;if(rms>RMS){speech=true;lastVoice=now}if(speech&&now-lastVoice>END&&age>MIN)finish();else if(speech&&age>MAX)finish();else if(!speech&&age>10000)rec.stop()}raf=requestAnimationFrame(loop)};loop()}
async function play(buf){playing=true;tracks(false);try{if(!ctx)throw new Error('audio context unavailable');if(ctx.state!=='running')await ctx.resume();const data=buf instanceof ArrayBuffer?buf.slice(0):buf;const decoded=await ctx.decodeAudioData(data);await new Promise((resolve,reject)=>{const source=ctx.createBufferSource();source.buffer=decoded;source.connect(ctx.destination);source.onended=resolve;try{source.start(0)}catch(e){reject(e)}})}catch{status('Audio playback blocked. Tap microphone once.',2800)}finally{playing=false;resume()}}function resume(){if(!turnDone||playing)return;turnDone=false;busy=false;if(micOn){tracks(true);startRecorder()}paint();status(micOn?'Listening…':'Microphone paused',850)}
async function boot(){try{const h=await fetch('/health',{cache:'no-store'}).then(r=>r.json());if(!h.offline_ready)status('Local AI is starting…',2200);await socket();status('Tap microphone to start',3500)}catch(e){status(e.message||'Local AI unavailable',3500)}}$('mic').onclick=async()=>{if(!micOn){micOn=true;paint();try{await armMic();status('Listening…')}catch(e){micOn=false;tracks(false);paint();status(e.message||'Microphone unavailable',4000)}}else{micOn=false;tracks(false);try{if(rec?.state==='recording')rec.stop()}catch{}paint();status('Microphone paused')}};$('speaker').onclick=()=>{speakerOn=!speakerOn;localStorage.setItem('eburonSpeaker',speakerOn?'on':'off');configure();paint()};$('reset').onclick=()=>{if(ws?.readyState===WebSocket.OPEN)ws.send(JSON.stringify({type:'clear'}));localStorage.removeItem('eburonHistory');$('heard').textContent='';$('translated').textContent='';$('live').style.display='none';status('Conversation reset')};$('pause').onclick=()=>{closed=true;micOn=false;clearTimeout(reconnect);cancelAnimationFrame(raf);try{if(rec?.state==='recording')rec.stop()}catch{}stream?.getTracks().forEach(t=>t.stop());try{ws?.close()}catch{}ctx?.close().catch(()=>{});location.href='/'};paint();boot();if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('/service-worker.js').catch(()=>{}));
</script></body></html>
